<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrabNet Resolver Options</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
             max-width: 480px; padding: 16px; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      input[type="url"] { width: 100%; padding: 8px; font: inherit; }
      .hint { color: #666; font-size: 12px; margin-top: 4px; }
      button { margin-top: 16px; padding: 8px 16px; font: inherit; }
      .saved { color: #2a7a2a; margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1>GrabNet Resolver</h1>
    <label for="gateway">Gateway URL</label>
    <input id="gateway" type="url" placeholder="http://127.0.0.1:8080" />
    <div class="hint">
      Where to forward <code>grab://</code> links and the <code>grab</code>
      omnibox keyword. Use a local <code>grab gateway</code> for full
      decentralization, or any trusted hosted instance.
    </div>
    <button id="save">Save</button>
    <span id="saved" class="saved" hidden>Saved.</span>
    <script src="options.js"></script>
  </body>
</html>
