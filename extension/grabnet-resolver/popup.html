<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrabNet</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, sans-serif;
             width: 280px; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      input { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
      .hint { color: #666; font-size: 11px; margin-top: 6px; }
      a { color: #1a73e8; text-decoration: none; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Open via GrabNet</h1>
    <input id="q" type="text" placeholder="site-id, hostname, or grab://..." autofocus />
    <div class="hint">
      Press Enter. Or type <code>grab</code> + space in the address bar.
    </div>
    <p><a href="#" id="opts">Options…</a></p>
    <script src="popup.js"></script>
  </body>
</html>
